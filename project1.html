<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Task Manager</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:linear-gradient(to right,#dbeafe,#fce7f3);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
    }

    .container{
      width:100%;
      max-width:1000px;
      background:white;
      border-radius:20px;
      padding:30px;
      box-shadow:0px 10px 30px rgba(0,0,0,0.2);
    }

    .title{
      text-align:center;
      margin-bottom:25px;
    }

    .title h1{
      font-size:40px;
      color:#1e3a8a;
    }

    .title p{
      margin-top:5px;
      color:gray;
    }

    /* LOGIN */

    .login-box{
      background:#eff6ff;
      padding:20px;
      border-radius:15px;
      margin-bottom:25px;
      border-left:7px solid #2563eb;
    }

    .login-box h2{
      color:#1d4ed8;
      margin-bottom:15px;
    }

    .login-box input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:2px solid #cbd5e1;
      outline:none;
    }

    .login-box button{
      margin-top:15px;
      padding:12px 20px;
      background:#2563eb;
      color:white;
      border:none;
      border-radius:10px;
      cursor:pointer;
    }

    /* TASK BOX */

    .task-box{
      background:#fdf2f8;
      padding:20px;
      border-radius:15px;
      border-left:7px solid #ec4899;
      margin-bottom:25px;
    }

    .task-box h2{
      color:#be185d;
      margin-bottom:15px;
    }

    .task-box input,
    .task-box textarea{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:2px solid #f9a8d4;
      outline:none;
    }

    textarea{
      resize:none;
      height:80px;
    }

    .task-box button{
      margin-top:15px;
      padding:12px 20px;
      background:#ec4899;
      color:white;
      border:none;
      border-radius:10px;
      cursor:pointer;
    }

    /* TASK SECTION */

    .tasks{
      margin-top:30px;
    }

    .tasks h2{
      margin-bottom:20px;
      color:#0f172a;
    }

    .task{
      background:#f8fafc;
      padding:15px;
      border-radius:15px;
      margin-bottom:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-left:6px solid orange;
    }

    .task.completed{
      border-left:6px solid green;
      background:#dcfce7;
    }

    .task-info h3{
      margin-bottom:5px;
      color:#111827;
    }

    .task-info p{
      color:#475569;
      font-size:14px;
    }

    .btns button{
      margin-left:8px;
      padding:8px 12px;
      border:none;
      border-radius:8px;
      color:white;
      cursor:pointer;
    }

    .complete-btn{
      background:#16a34a;
    }

    .edit-btn{
      background:#f59e0b;
    }

    .delete-btn{
      background:#dc2626;
    }

    /* COLUMNS */

    .columns{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-top:25px;
    }

    .column{
      background:#f8fafc;
      padding:15px;
      border-radius:15px;
      min-height:250px;
    }

    .column h3{
      text-align:center;
      color:white;
      padding:10px;
      border-radius:10px;
      margin-bottom:15px;
    }

    .incomplete-title{
      background:#f59e0b;
    }

    .complete-title{
      background:#16a34a;
    }

    .completed-task{
      background:white;
      padding:12px;
      border-radius:10px;
      margin-bottom:10px;
      border-left:5px solid green;
      font-weight:bold;
      color:#065f46;
    }

    /* QUOTE */

    .quote-box{
      margin-top:25px;
      background:linear-gradient(to right,#7c3aed,#ec4899);
      color:white;
      padding:18px;
      border-radius:15px;
      text-align:center;
      font-style:italic;
    }

    @media(max-width:768px){

      .columns{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="title">

      <h1>Daily Task Manager</h1>

      <p>Organize your work like a smart beginner developer 😎</p>

    </div>

    <!-- LOGIN -->

    <div class="login-box">

      <h2>User Login</h2>

      <input type="text" id="email" placeholder="Enter username or email">

      <input type="password" id="password" placeholder="Enter password">

      <button onclick="loginUser()">Login</button>

    </div>

    <!-- ADD TASK -->

    <div class="task-box">

      <h2>Add New Task</h2>

      <input type="text" id="taskTitle" placeholder="Enter task title">

      <textarea id="taskDesc" placeholder="Enter task description"></textarea>

      <button onclick="addTask()">Add Task</button>

    </div>

    <!-- TASKS -->

    <div class="tasks">

      <h2>My Tasks</h2>

      <!-- TASKS WITH BUTTONS -->
      <div id="taskContainer"></div>

      <!-- TWO COLUMNS -->
      <div class="columns">

        <!-- INCOMPLETE COLUMN -->

        <div class="column">

          <h3 class="incomplete-title">Incomplete Tasks</h3>

          <div id="incompleteContainer"></div>

        </div>

        <!-- COMPLETE COLUMN -->

        <div class="column">

          <h3 class="complete-title">Completed Tasks</h3>

          <div id="completeContainer"></div>

        </div>

      </div>

    </div>

    <!-- QUOTE -->

    <div class="quote-box">

      "Small progress each day leads to big success 🚀"

    </div>

  </div>

  <script>

    let taskContainer =
    document.getElementById("taskContainer");

    let incompleteContainer =
    document.getElementById("incompleteContainer");

    let completeContainer =
    document.getElementById("completeContainer");

    let currentUser = "";

    // HIDE FIRST

    document.querySelector(".task-box").style.display = "none";

    document.querySelector(".tasks").style.display = "none";

    document.querySelector(".quote-box").style.display = "none";

    // LOGIN

    function loginUser(){

      let email =
      document.getElementById("email").value;

      let password =
      document.getElementById("password").value;

      if(email.trim() == "" || password.trim() == ""){

        alert("Please enter email and password");

        return;

      }

      localStorage.setItem(email,password);

      currentUser = email;

      alert("Login Successful");

      document.querySelector(".login-box").style.display = "none";

      document.querySelector(".task-box").style.display = "block";

      document.querySelector(".tasks").style.display = "block";

      document.querySelector(".quote-box").style.display = "block";

      loadTasks();

    }

    // ADD TASK

    function addTask(){

      let title =
      document.getElementById("taskTitle").value.trim();

      let desc =
      document.getElementById("taskDesc").value.trim();

      if(title == ""){

        alert("Please enter task title");

        return;

      }

      let task = {

        title:title,

        desc:desc,

        completed:false

      };

      let tasks =
      JSON.parse(localStorage.getItem(currentUser + "_tasks")) || [];

      tasks.push(task);

      localStorage.setItem(
        currentUser + "_tasks",
        JSON.stringify(tasks)
      );

      showTask(task);

      document.getElementById("taskTitle").value = "";

      document.getElementById("taskDesc").value = "";

    }

    // SHOW TASK

    function showTask(task){

      if(task.title == null || task.title.trim() == ""){
        return;
      }

      // MAIN TASK CARD

      let taskDiv = document.createElement("div");

      taskDiv.classList.add("task");

      taskDiv.innerHTML = `

      <div class="task-info">

        <h3>${task.title}</h3>

        <p>${task.desc}</p>

      </div>

      <div class="btns">

        <button class="complete-btn"
        onclick="completeTask(this)">
        Complete
        </button>

        <button class="edit-btn"
        onclick="editTask(this)">
        Edit
        </button>

        <button class="delete-btn"
        onclick="deleteTask(this)">
        Delete
        </button>

      </div>

      `;

      taskContainer.appendChild(taskDiv);

      // SHOW ONLY TITLE IN INCOMPLETE COLUMN

      if(task.completed == false){

        let incompleteTask =
        document.createElement("div");

        incompleteTask.classList.add("completed-task");

        incompleteTask.innerText = task.title;

        incompleteContainer.appendChild(incompleteTask);

      }

      // SHOW ONLY TITLE IN COMPLETE COLUMN

      if(task.completed == true){

        let completeTask =
        document.createElement("div");

        completeTask.classList.add("completed-task");

        completeTask.innerText = task.title;

        completeContainer.appendChild(completeTask);

      }

    }

    // LOAD TASKS

    function loadTasks(){

      taskContainer.innerHTML = "";

      incompleteContainer.innerHTML = "";

      completeContainer.innerHTML = "";

      let tasks =
      JSON.parse(localStorage.getItem(currentUser + "_tasks")) || [];

      tasks.forEach(function(task){

        showTask(task);

      });

    }

    // COMPLETE TASK

    function completeTask(button){

      let taskDiv =
      button.parentElement.parentElement;

      let title =
      taskDiv.querySelector("h3").innerText;

      let tasks =
      JSON.parse(localStorage.getItem(currentUser + "_tasks")) || [];

      tasks.forEach(function(task){

        if(task.title == title){

          task.completed = true;

        }

      });

      localStorage.setItem(
        currentUser + "_tasks",
        JSON.stringify(tasks)
      );

      loadTasks();

    }

    // DELETE TASK

    function deleteTask(button){

      let taskDiv =
      button.parentElement.parentElement;

      let title =
      taskDiv.querySelector("h3").innerText;

      let tasks =
      JSON.parse(localStorage.getItem(currentUser + "_tasks")) || [];

      tasks = tasks.filter(function(task){

        return task.title != title;

      });

      localStorage.setItem(
        currentUser + "_tasks",
        JSON.stringify(tasks)
      );

      loadTasks();

    }

    // EDIT TASK

    function editTask(button){

      let taskDiv =
      button.parentElement.parentElement;

      let heading =
      taskDiv.querySelector("h3");

      let paragraph =
      taskDiv.querySelector("p");

      let oldTitle = heading.innerText;

      let newTitle =
      prompt("Edit task title",heading.innerText);

      let newDesc =
      prompt("Edit task description",paragraph.innerText);

      if(newTitle === null || newTitle.trim() == ""){

        newTitle = heading.innerText;

      }

      if(newDesc === null){

        newDesc = paragraph.innerText;

      }

      let tasks =
      JSON.parse(localStorage.getItem(currentUser + "_tasks")) || [];

      tasks.forEach(function(task){

        if(task.title == oldTitle){

          task.title = newTitle;

          task.desc = newDesc;

        }

      });

      localStorage.setItem(
        currentUser + "_tasks",
        JSON.stringify(tasks)
      );

      loadTasks();

    }

  </script>

</body>
</html>
